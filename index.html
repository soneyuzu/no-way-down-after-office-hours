<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0f" />
    <meta
      name="description"
      content="After Office Hours — private character archive. Enter to browse the orbital stand and dossiers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="After Office Hours" />
    <meta
      property="og:description"
      content="Private character archive — enter to browse the orbital stand and dossiers."
    />
    <title>After Office Hours</title>
    <link rel="icon" href="assets/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
    <link
      rel="preload"
      href="assets/fonts/calora.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/gaibo.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/images/introforoc.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/intro.css" />
  </head>
  <body class="intro-page">
    <main class="intro" id="intro" tabindex="0" aria-label="After Office Hours — enter archive">
      <div class="page-frame" aria-hidden="true"></div>
      <div class="corner corner-tl" aria-hidden="true"></div>
      <div class="corner corner-tr" aria-hidden="true"></div>
      <div class="corner corner-bl" aria-hidden="true"></div>
      <div class="corner corner-br" aria-hidden="true"></div>

      <header class="brand-mark">
        <h1 class="title">AFTER OFFICE HOURS</h1>
        <p class="subtitle">Character Archive</p>
      </header>

      <div class="orbit-deco orbit-left" aria-hidden="true"></div>
      <div class="orbit-deco orbit-right" aria-hidden="true"></div>

      <div class="side-line left" aria-hidden="true"></div>
      <div class="side-line right" aria-hidden="true"></div>

      <div class="star star-one" aria-hidden="true"></div>
      <div class="star star-two" aria-hidden="true"></div>
      <div class="star star-three" aria-hidden="true"></div>
      <div class="star star-four" aria-hidden="true"></div>

      <div class="cross cross-one" aria-hidden="true"></div>
      <div class="cross cross-two" aria-hidden="true"></div>
      <div class="cross cross-three" aria-hidden="true"></div>
      <div class="cross cross-four" aria-hidden="true"></div>

      <div class="art-frame">
        <div class="artwork">
          <img
            src="assets/images/introforoc.webp"
            alt="After Office Hours"
            width="1200"
            height="1698"
            fetchpriority="high"
            decoding="async"
          />
        </div>
      </div>

      <div class="micro micro-one" aria-hidden="true">INDEX / 001</div>
      <div class="micro micro-two" aria-hidden="true">PRIVATE COLLECTION</div>
      <div class="micro micro-three" aria-hidden="true">— — — — —</div>
      <div class="micro micro-four" aria-hidden="true">01 / 05</div>

      <div class="bottom-dash" aria-hidden="true"></div>
      <div class="enter">CLICK ANYWHERE TO ENTER</div>
    </main>

    <script type="module">
      import { initIntro } from "./js/intro.js";
      initIntro(document.getElementById("intro"));
    </script>
  </body>
</html>
