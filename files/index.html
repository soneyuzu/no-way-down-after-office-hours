<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NO WAY DOWN AFTER OFFICE HOURS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.toggle('touch-ui', window.matchMedia('(hover: none), (max-width: 900px)').matches)</script>
</head>
<body>
<div id="app">
<canvas id="ambientCanvas" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain-overlay" aria-hidden="true"></div>

<main class="archive-stage">
  <div class="stage-glow" aria-hidden="true"></div>
  <header class="stage-mast">
    <p class="stage-kicker">NO WAY DOWN</p>
    <h1 class="stage-title">AFTER OFFICE HOURS</h1>
    <div class="stage-ornament" aria-hidden="true"><i></i><span>ARCHIVE</span><i></i></div>
  </header>
  <div class="stage-rule" aria-hidden="true">FILE / 05</div>
  <a class="mode-switch mode-switch--orbit" href="../archive.html" aria-label="Back to orbital stand">
    <span class="mode-switch-kicker">OPEN</span>
    <span class="mode-switch-label">STAND</span>
  </a>
  <div class="folder-stack" id="folderStack"></div>
  <div class="stage-floor" aria-hidden="true"><span></span><span></span><span></span></div>
</main>

<div class="mood-overlay" id="moodOverlay" aria-hidden="true">
  <div class="mood-backdrop" id="moodBackdrop"></div>
  <div class="mood-window" id="moodWindow">
    <div class="mood-window-inner" id="moodContent"></div>
    <button class="mood-close" id="moodClose" aria-label="Close mood board"><span class="close-label"></span><span class="close-x">×</span></button>
  </div>
</div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="main.js"></script>
</body>
</html>
